services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.8
    container_name: trend_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflow_template.json:/workflows/workflow_template.json:ro

  api_gateway:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: trend_fastapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/lead-ingest
      N8N_TIMEOUT_SECONDS: "4.0"
      STRICT_WEBHOOK_DELIVERY: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8000
      CORS_ALLOW_CREDENTIALS: "false"
      ENVIRONMENT: development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - n8n

volumes:
  n8n_data:
